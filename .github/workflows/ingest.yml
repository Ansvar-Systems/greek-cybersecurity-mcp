name: Ingest NCSA Data

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-ingest even if data appears current"
        required: false
        default: "false"
        type: boolean

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create data directory
        run: mkdir -p data

      - name: Run NCSA ingest
        env:
          NCSA_DB_PATH: data/ncsa.db
        run: npm run ingest

      - name: Verify ingest results
        env:
          NCSA_DB_PATH: data/ncsa.db
        run: |
          node -e "
          import('./dist/src/db.js').then(({ getDb }) => {
            const db = getDb();
            const g = db.prepare('SELECT COUNT(*) as n FROM guidance').get();
            const a = db.prepare('SELECT COUNT(*) as n FROM advisories').get();
            const f = db.prepare('SELECT COUNT(*) as n FROM frameworks').get();
            console.log('Ingest complete:');
            console.log('  guidance:   ' + g.n + ' records');
            console.log('  advisories: ' + a.n + ' records');
            console.log('  frameworks: ' + f.n + ' records');
            if (g.n === 0 && a.n === 0) {
              console.error('ERROR: No records ingested — ingest may have failed');
              process.exit(1);
            }
          });
          "

      - name: Set DATA_AGE for Docker build
        run: echo "DATA_AGE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image with fresh data
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ansvar-systems/greek-cybersecurity-mcp:latest
            ghcr.io/ansvar-systems/greek-cybersecurity-mcp:ingest-${{ github.run_number }}
          build-args: |
            DATA_AGE=${{ env.DATA_AGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
